[package]
name = "keywright-cli"
description = "The keywright command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "keywright"
path = "src/main.rs"

[dependencies]
# Parsing the command line.
clap.workspace = true
# The keymap model, backups and support packs.
keywright-core = { path = "../keywright-core" }
# The device session, which talks to the keyboard.
keywright-device = { path = "../keywright-device" }
# Where the app keeps automatic backups, which `restore` and `flash` make too, and the
# half's update drive, which `flash` copies firmware onto.
keywright-platform = { path = "../keywright-platform" }
# The simulated keyboard, for the CLI's tests (`KEYWRIGHT_SIMULATOR`).
keywright-sim = { path = "../keywright-sim" }
# `--json` output.
serde.workspace = true
serde_json.workspace = true
# The session runs on Tokio; the CLI waits on it with timeouts.
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
# Snapshot tests of whole commands: arguments, output and exit codes (tech spec §14.1).
trycmd.workspace = true

[lints]
workspace = true

[package]
name = "keywright-studio"
description = "A client for the ZMK Studio RPC protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
prost.workspace = true
thiserror.workspace = true
# The client's I/O task: channels, timers and `select!` (tech spec §5.3).
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# Logs what the client drops: bytes outside frames, undecodable messages, unknown replies.
tracing.workspace = true

# build.rs generates the message types from the vendored .proto files (tech spec §5.1).
[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
proptest.workspace = true
proptest-derive.workspace = true
# `test-util` lets tests pause the clock and skip ahead to a timeout.
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true

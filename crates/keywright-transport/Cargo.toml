[package]
name = "keywright-transport"
description = "USB serial and Bluetooth LE transports to ZMK keyboards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Bluetooth LE: finding the keyboards macOS has connected, and their Studio service (tech
# spec §6.2, ADR-0009).
bluest.workspace = true
# Reading bluest's indications, which come as a `Stream`.
futures-core.workspace = true
# The `Transport` trait this crate implements.
keywright-studio = { path = "../keywright-studio" }
# Serial ports: listing them with their USB IDs, opening, reading and writing (tech spec §6.1).
serialport.workspace = true
thiserror.workspace = true
# The reader and writer threads and the indication task hand bytes over channels; the
# port watcher polls on a timer, and Bluetooth's setup steps have timeouts.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# Logs what the transport can't report as an error, such as a port list that failed.
tracing.workspace = true

# Only to turn on a feature: the crate forbids `unsafe`, so it can't call objc2. In debug
# builds, objc2 checks each call's signature. bluest reads peripherals' identifiers through
# `NSUUID`, whose signature on macOS 27 isn't the one objc2 expects, and the check aborts.
# objc2-foundation's `NSUUID` docs say to turn it off; release builds never check. Every
# build with Bluetooth in it has this crate, so every one gets the feature. The
# architecture tests allow this one dependency on an OS binding.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, features = ["disable-encoding-assertions"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["objc2"]

# Tests may unwrap, panic and print: a failing test should fail loudly.
# Outside tests, the workspace denies these lints (Cargo.toml).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Proper names that clippy would otherwise take for code in doc comments.
doc-valid-idents = [
  "AppKit",
  "CoreBluetooth",
  "DiskArbitration",
  "IOKit",
  "ServiceManagement",
  "VoiceOver",
  "..",
]

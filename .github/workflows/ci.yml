name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Runs every job for the branch you pick (Actions › Run workflow).
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Each job installs only the tools it names in `install_args`. A task that needs
  # another tool then fails instead of quietly installing it.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

# Every job runs the same mise tasks as `mise run check` does locally (tech spec §13.5).
jobs:
  rust:
    name: Rust (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          minimum_release_age: 3d
          # Bun runs the key table generator's drift check.
          install_args: github:nextest-rs/nextest github:Boshen/cargo-shear aqua:taiki-e/cargo-llvm-cov cargo-deny bun

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check that Cargo.lock is up to date
        run: cargo fetch --locked

      - name: Audit crates (cargo-deny)
        run: |
          mise run audit:rust
          mise run audit:fuzz

      - name: Lint (rustfmt, clippy, cargo-shear)
        run: mise run lint:rust

      - name: Check the API docs (rustdoc)
        run: mise run lint:docs

      # Regenerates keywright-core's key tables and fails if they differ from the committed
      # ones. It runs here because it needs macOS, for the SDK's Events.h, and rustfmt.
      - name: Check the generated key tables
        run: mise run lint:key-tables

      - name: Test (nextest, doc tests)
        run: mise run test:rust

      # Reports the whole workspace, and fails if keywright-core drops below 80% of lines.
      - name: Coverage
        run: mise run coverage

  app:
    name: App (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          minimum_release_age: 3d
          # Bun builds the UI and runs Tauri's command-line tool; nextest runs the bindings
          # check.
          install_args: bun github:nextest-rs/nextest

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Check that Cargo.lock is up to date
        run: cargo fetch --locked

      # Regenerates the UI's IPC bindings, and fails if they differ from the committed ones.
      - name: Check the UI's IPC bindings
        run: mise run lint:bindings

      # Builds the UI, then the app around it, unoptimised and without bundling it.
      - name: Build the app (tauri build --debug --no-bundle)
        run: mise run build:debug

  rust-portable:
    name: Rust portable (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          minimum_release_age: 3d
          install_args: github:nextest-rs/nextest

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check that Cargo.lock is up to date
        run: cargo fetch --locked

      - name: Build and test core, studio and sim (NFR-7)
        run: mise run portable

  ui:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          minimum_release_age: 3d
          install_args: bun

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Audit packages (bun audit)
        run: mise run audit:ts

      - name: Lint (oxfmt, oxlint, tsc, knip)
        run: mise run lint:ts

      - name: Check the design tokens' contrast
        run: mise run lint:contrast

      - name: Check the CSS Modules' typings
        run: mise run lint:css-types

      - name: Test (bun test)
        run: mise run test:ts

  repo:
    name: Spelling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          minimum_release_age: 3d
          install_args: typos

      - name: Check spelling (typos)
        run: mise run lint:spelling

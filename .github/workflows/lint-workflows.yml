name: Lint workflows

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tool versions come from mise.toml, as for local runs of `mise run lint:workflows`.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          minimum_release_age: 3d
          install_args: actionlint shellcheck zizmor

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --format=github .
        env:
          GH_TOKEN: ${{ github.token }}

name: Fuzz

# A short fuzzing run whenever the fuzzed code or the tools that build it change (tech spec
# §13.2, §13.5). scheduled.yml runs a long one every night.
on:
  pull_request:
    paths:
      - crates/keywright-core/src/backup.rs
      - crates/keywright-core/src/backup/**
      - crates/keywright-core/src/firmware.rs
      - crates/keywright-core/src/firmware/**
      - crates/keywright-studio/**
      - fuzz/**
      - Cargo.lock
      - mise.toml
      - rust-toolchain.toml
      - .github/workflows/fuzz.yml
  push:
    branches: [main]
    paths:
      - crates/keywright-core/src/backup.rs
      - crates/keywright-core/src/backup/**
      - crates/keywright-core/src/firmware.rs
      - crates/keywright-core/src/firmware/**
      - crates/keywright-studio/**
      - fuzz/**
      - Cargo.lock
      - mise.toml
      - rust-toolchain.toml
      - .github/workflows/fuzz.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The fuzz task installs cargo-fuzz itself, since no other task uses it.
      MISE_TASK_RUN_AUTO_INSTALL: "true"
      FUZZ_SECONDS: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # None of the tools under [tools] is needed: the task brings its own.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          minimum_release_age: 3d
          install: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Start from the inputs the nightly runs have collected, so this short run also
      # replays them.
      - name: Restore the fuzzing corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz each target for a minute
        run: mise run fuzz

      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

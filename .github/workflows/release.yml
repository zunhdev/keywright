name: Release

# Builds a release from a `v*` tag and drafts it on GitHub (tech spec §17,
# docs/contributing/releasing.md): the app, signed with Keywright's own certificate, the
# command-line tool, their checksums, and build provenance attestations. The maintainer
# reviews the draft and publishes it.
on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time for a tag; never cancel one half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 90
    # The signing certificate is a secret of this environment, which only `v*` tags can
    # use, so no other workflow or branch can read it.
    environment: release
    permissions:
      contents: write # drafts the release and uploads its files
      id-token: write # signs the build provenance attestations
      attestations: write # stores them
    # No caches: a release builds from nothing, so nothing a pull request saved can end up
    # in it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every tool in mise.toml, for the full gate.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          minimum_release_age: 3d
          cache: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # The tag names the version the app and the CLI share: v1.0.0 for 1.0.0.
      - name: Check that the tag is the version in Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "keywright-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but Cargo.toml's version is $version: tag v$version, or set the version first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check everything (mise run check)
        run: mise run check

      # A keychain of the job's own, with the certificate, trusted for code signing, which
      # codesign needs for a certificate that isn't Apple's (spike S8). The runner is
      # thrown away afterwards, and the last step deletes the keychain anyway.
      - name: Import the signing certificate
        id: certificate
        env:
          CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::The release environment's secrets SIGNING_CERTIFICATE and SIGNING_CERTIFICATE_PASSWORD aren't set (docs/contributing/releasing.md)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # The new keychain first, so codesign finds the identity.
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # One keychain per word.
          security list-keychains -d user -s "$keychain" $existing
          security find-certificate -a -p "$keychain" > "$RUNNER_TEMP/certificate.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k "$keychain" "$RUNNER_TEMP/certificate.pem"
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk 'NR == 1 && length($2) == 40 && $2 ~ /^[0-9A-F]+$/ { print $2 }')
          if [ -z "$identity" ]; then
            echo "::error::The certificate isn't a code signing identity."
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      # Tauri signs with the identity in APPLE_SIGNING_IDENTITY rather than the ad-hoc
      # signature (`-`) that tauri.conf.json gives local builds.
      - name: Build the app (tauri build --bundles app)
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.certificate.outputs.identity }}
        run: bun run tauri build --bundles app

      # The designated requirement names the certificate, not the build's hash, so macOS
      # keeps people's permissions across updates (spike S8). A self-signed certificate is
      # its own root, which codesign names it as: `certificate root = H"…"`.
      - name: Check the app's signature
        run: |
          app=target/release/bundle/macos/Keywright.app
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement=$(codesign --display --requirements - "$app" 2>&1)
          echo "$requirement"
          if ! echo "$requirement" | grep -Eq 'certificate (root|leaf) = H"'; then
            echo "::error::The app isn't signed with Keywright's certificate."
            exit 1
          fi

      - name: Build the CLI
        run: cargo build --release --locked --package keywright-cli

      - name: Package the app and the CLI, with their checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          # ditto keeps the bundle's metadata and symbolic links, which zip doesn't.
          ditto -c -k --keepParent target/release/bundle/macos/Keywright.app \
            "dist/Keywright-$VERSION-aarch64-apple-darwin.zip"
          cli="keywright-$VERSION-aarch64-apple-darwin"
          mkdir "$cli"
          cp target/release/keywright LICENSE-MIT LICENSE-APACHE "$cli/"
          tar -czf "dist/$cli.tar.gz" "$cli"
          (cd dist && shasum -a 256 -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS

      # The notes are the template's text below its `---`, with the version filled in. A
      # version such as 1.0.0-rc.1 is a pre-release.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -n '/^---$/,$p' docs/contributing/release-notes-template.md | tail -n +2 |
            sed "s/<version>/$VERSION/g" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Keywright $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"

      - name: Delete the signing keychain
        if: always() && steps.certificate.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

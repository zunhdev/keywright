# The keyboard's physical layout: where each key is (tech spec §10, design §7).
#
# The keyboard reports its layout only once it's unlocked, so Keywright draws this copy on
# the unlock sheet. Once unlocked, the layout the keyboard reports must match this one, key
# for key, to confirm the keyboard is the one this pack describes.
#
# From `default_layout` in `boards/arm/sofle_choc_pro/sofle_choc_pro-layouts.dtsi`, in
# Keebart/zmk-config at the revision pack.toml names. Lengths are in hundredths of a key
# unit and angles in hundredths of a degree, as ZMK writes them. A key is 100 wide and 100
# high unless it says otherwise, and its rotation is clockwise, around (rotation-x,
# rotation-y).

name = "Default Layout"

# The rows, top to bottom. Their keys are in key-position order, and backups write each
# label as a comment before the row.


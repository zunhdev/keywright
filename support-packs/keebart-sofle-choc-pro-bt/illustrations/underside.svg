<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 1740 646" role="img" aria-labelledby="title desc">
  <title id="title">Keebart Sofle Choc Pro BT, from below</title>
  <desc id="desc">Both halves seen from below, so the left half is on the right. Each has its reset button next to its USB port.</desc>
  <style>
    path, rect, circle { fill: none; stroke: currentColor; stroke-linejoin: round; }
    .case { stroke-width: 4; }
    .key, .knob circle { stroke-width: 3; }
    .knob-ring { stroke-width: 2; stroke-dasharray: 6 6; }
    .usb-port, .reset-button { stroke-width: 3; }
  </style>
  <g transform="translate(1660 0) scale(-1 1)">
    <g id="left-half">
      <path class="case" d="M-30 37 L-29 29 L-26 22 L-21 16 L-15 11 L-8 8 L200 -18 L300 -30 L400 -30 L700 -6 L708 -5 L715 -2 L721 3 L726 9 L729 16 L730 24 L742 428 L741 436 L738 443 L677 580 L672 586 L666 591 L658 594 L651 595 L175 567 L167 566 L160 563 L-15 463 L-21 458 L-26 452 L-29 445 L-30 437 Z"/>
      <rect class="usb-port" id="usb-port-left" x="625" y="-10" width="50" height="18" rx="8"/>
      <circle class="reset-button" id="reset-button-left" cx="595" cy="24" r="12"/>
    </g>
    <g id="right-half" transform="translate(160 0)">
      <path class="case" d="M758 428 L770 24 L771 16 L774 9 L779 3 L785 -2 L792 -5 L800 -6 L1100 -30 L1200 -30 L1300 -18 L1508 8 L1515 11 L1521 16 L1526 22 L1529 29 L1530 37 L1530 437 L1529 445 L1526 452 L1521 458 L1515 463 L1340 563 L1333 566 L1325 567 L849 595 L842 594 L834 591 L828 586 L823 580 L762 443 L759 436 Z"/>
      <rect class="usb-port" id="usb-port-right" x="825" y="-10" width="50" height="18" rx="8"/>
      <circle class="reset-button" id="reset-button-right" cx="905" cy="24" r="12"/>
    </g>
  </g>
</svg>

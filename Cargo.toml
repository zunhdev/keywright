[workspace]
members = ["app/src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zunhdev/keywright"
publish = false

# Shared versions for third-party crates. A member opts in with `name.workspace = true`.
[workspace.dependencies]
# Bluetooth LE through CoreBluetooth, for the Bluetooth transport (ADR-0009).
bluest = "0.6.9"
cargo_metadata = "0.23.1"
# The CLI's command-line parsing, with `derive` for declaring it as types.
clap = { version = "4.6.7", features = ["derive"] }
# The `Stream` trait, which bluest's indications come as.
futures-core = { version = "0.3.34", default-features = false }
insta = { version = "1.49.0", default-features = false }
# AppKit, for the macOS integration in keywright-platform (tech spec §11), at the versions
# Tauri uses: objc2 calls Objective-C, objc2-app-kit has the AppKit classes, and
# objc2-foundation the Foundation ones.
#
# In debug builds, objc2 checks every call's signature. bluest (the Bluetooth transport)
# reads peripherals' identifiers through `NSUUID`, whose signature on macOS 27 isn't the
# one objc2 expects, and the check aborts. objc2-foundation's `NSUUID` docs say to turn the
# check off; release builds never make it. The app and the CLI get it through
# keywright-platform, and keywright-transport's tests through their own dev-dependency.
objc2 = { version = "0.6.5", features = ["disable-encoding-assertions"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSProcessInfo",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
# The menu library Tauri uses, for the app's tests of its menu shortcuts. Keep it at the
# version in Cargo.lock that `tauri` depends on.
muda = { version = "0.20.0", default-features = false }
proptest = "1.12.0"
proptest-derive = "0.9.0"
# Native window handles, which Tauri's windows give keywright-platform.
raw-window-handle = { version = "0.6.2", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Typed IPC between the app and its UI (ADR-0010): TypeScript bindings generated from the
# Rust commands, events and types. Release candidates, so pinned exactly, and moved
# together: tauri-specta needs this exact specta.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
serialport = "4.10.1"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
# The desktop app's framework (tech spec §12.1), its build script, and the plugins the
# shell uses. Tauri's command-line tool, which builds the app, comes from Bun
# (`@tauri-apps/cli` in package.json); keep its minor version in step with `tauri`.
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.21"
# Parsing only: Keywright writes its files itself, to control their layout and comments.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tokio = "1.53.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
trycmd = "1.2.1"

# Every member inherits these lints with `[lints] workspace = true` (tech spec §13.2).
# CI runs clippy with `-D warnings`, so warnings fail the build there too.
[workspace.lints.rust]
# `unsafe` is forbidden everywhere except in keywright-platform's `ffi` modules (tech spec §4).
# A crate can't relax a single inherited lint, so the workspace level is `deny`, and every
# crate other than keywright-platform adds `#![forbid(unsafe_code)]` at its root.
# The architecture-tests crate fails if one doesn't.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No crashes or stray output on device or file input (tech spec §16). clippy.toml lets
# tests use these, and the CLI allows `print_stdout` at its crate root.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
# Every `unsafe` block needs a `// SAFETY:` comment explaining why it is sound.
undocumented_unsafe_blocks = "deny"

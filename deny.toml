# Supply-chain policy for Rust crates, checked by cargo-deny (tech spec §13.2, §16).
#
# `mise run audit:rust` runs every check below. CI runs them on each pull request, and
# `scheduled.yml` re-checks advisories daily, because new advisories appear without any
# change to the code. Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Keywright ships for Apple Silicon Macs only. Dependencies used only on other platforms
# aren't checked.
targets = ["aarch64-apple-darwin"]
# Check optional features too, as clippy does.
all-features = true

[advisories]
# Known vulnerabilities (RustSec) always fail the check.
# An unmaintained crate fails only when one of our crates depends on it directly: that's
# where we can choose another crate. Deeper in the tree, it's up to that dependency.
unmaintained = "workspace"
# A crate version that its authors withdrew (yanked) fails too.
yanked = "deny"
# To accept an advisory, add it here with a reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "…" }.
ignore = []

[licenses]
# Licences that are compatible with distributing Keywright under MIT OR Apache-2.0.
# Anything else, copyleft licences included, fails the check. Adding a licence here, or an
# exception for one crate below, is a decision to explain in the pull request.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# This is a policy, not a list of what's in use today, so unused entries are fine.
unused-allowed-license = "allow"
exceptions = [
  # libFuzzer, which this crate builds, comes from LLVM under the NCSA licence, a permissive
  # licence like BSD-3-Clause. Only the fuzz targets use it, and they don't ship.
  { crate = "libfuzzer-sys", allow = ["NCSA"] },
  # serialport, the USB transport's serial port library (tech spec §6.1), is MPL-2.0. That
  # licence is copyleft per file: it covers serialport's own files, not Keywright's. We use
  # them unchanged, and their source stays available on crates.io and in Cargo.lock, so
  # Keywright can still be MIT OR Apache-2.0. Its credits must list serialport.
  { crate = "serialport", allow = ["MPL-2.0"] },
  # Tauri (tech spec §12.1) depends on these MPL-2.0 crates, on the same terms as
  # serialport: we use them unchanged, so Keywright stays MIT OR Apache-2.0, and the
  # credits must list them. Its HTML handling uses Servo's CSS parser (cssparser,
  # cssparser-macros, dtoa-short and selectors), and its app folders use option-ext.
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

[bans]
# Two versions of one crate compile twice and grow the binary. Worth knowing, but often
# out of our hands, so it only warns.
multiple-versions = "warn"
# A `*` version requirement accepts any release, so it is denied. Path dependencies
# between our own crates have no version, and stay allowed: none is published.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates come from crates.io only: no other registry, and no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Supply-chain policy for Rust crates, checked by cargo-deny (tech spec §13.2, §16).
#
# `mise run audit:rust` runs every check below. CI runs them on each pull request, and
# `scheduled.yml` re-checks advisories daily, because new advisories appear without any
# change to the code. Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Keywright ships for Apple Silicon Macs only. Dependencies used only on other platforms
# aren't checked.
targets = ["aarch64-apple-darwin"]
# Check optional features too, as clippy does.
all-features = true

[advisories]
# Known vulnerabilities (RustSec) always fail the check.
# An unmaintained crate fails only when one of our crates depends on it directly: that's
# where we can choose another crate. Deeper in the tree, it's up to that dependency.
unmaintained = "workspace"
# A crate version that its authors withdrew (yanked) fails too.
yanked = "deny"
# To accept an advisory, add it here with a reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "…" }.
ignore = []

[licenses]
# The common open-source licences: the permissive ones, and MPL-2.0, which serialport and
# Tauri's CSS parser use.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# The list covers what's common, not only what's in use today.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate compile twice and grow the binary. Worth knowing, but often
# out of our hands, so it only warns.
multiple-versions = "warn"
# A `*` version requirement accepts any release, so it is denied. Path dependencies
# between our own crates have no version, and stay allowed: none is published.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates come from crates.io only: no other registry, and no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[package]
name = "keywright-app"
description = "Keywright's desktop app: the Tauri shell around the UI in app/ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
# Reads tauri.conf.json and the capabilities, and checks them while compiling.
tauri-build.workspace = true

[dependencies]
# The keymap model, for what the UI shows.
keywright-core = { path = "../../crates/keywright-core" }
# The device session, which the UI drives through the commands and follows through the
# events.
keywright-device = { path = "../../crates/keywright-device" }
# The automatic backups' folder.
keywright-platform = { path = "../../crates/keywright-platform" }
# A simulated keyboard, which `KEYWRIGHT_SIMULATOR` connects instead of a real one.
keywright-sim = { path = "../../crates/keywright-sim" }
# The IPC payloads, as JSON.
serde.workspace = true
# Typed IPC (ADR-0010): `specta` describes the payloads, and tauri-specta the commands and
# events, from which `specta-typescript` writes the UI's bindings.
specta.workspace = true
specta-typescript.workspace = true
# The app framework: windows, menus and the webview that runs the UI. Its `devtools`
# feature stays off, so release builds have no web inspector (tech spec §12.1).
tauri.workspace = true
# Open and save panels.
tauri-plugin-dialog.workspace = true
# macOS notifications.
tauri-plugin-notification.workspace = true
# Opens System Settings and the docs, and nothing else (capabilities/main.json).
tauri-plugin-opener.workspace = true
# Brings the running app forward when Keywright is opened again.
tauri-plugin-single-instance.workspace = true
# Remembers the window's size and place.
tauri-plugin-window-state.workspace = true
tauri-specta.workspace = true
thiserror.workspace = true
# The session runs on Tauri's Tokio runtime, and the simulated keyboard's unlock waits on
# its timer.
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
# Parses the menu shortcuts the way Tauri does, to check them.
muda.workspace = true
# Reads tauri.conf.json and the capabilities in the security tests, and checks payloads.
serde_json.workspace = true
# Runs the session in the tests; `test-util` pauses the clock.
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true

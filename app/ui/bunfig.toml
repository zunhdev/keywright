# Bun settings for the UI's tests (tech spec §13.3). Install and run settings are in the
# repository's bunfig.toml.

[test]
# A browser's globals first, then what every test file needs.
preload = ["./src/test/happy-dom.ts", "./src/test/setup.ts"]
# Tests run in a random order, so they can't depend on each other.
randomize = true
# The UI's tests must cover at least 70% of its lines (tech spec §13.3), and of its
# functions. Both are given: with only `lines`, Bun holds functions to a stricter default,
# and fails without saying so.
coverage = true
coverageThreshold = { lines = 0.7, functions = 0.7 }
coverageSkipTestFiles = true
# Test helpers, and the generated IPC bindings.
coveragePathIgnorePatterns = ["src/test/**", "src/ipc/bindings.ts"]

[serve.static]
# Works around a Bun bug with CSS Modules in the dev server; see the file.
plugins = ["./dev-css-modules.ts"]

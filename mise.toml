# Tools and tasks for working on Keywright (tech spec §13.1).
#
# `mise install` installs every tool below at its pinned version, and `mise run <task>`
# runs the same checks locally as CI. The Rust toolchain itself comes from
# rust-toolchain.toml, through rustup. Renovate keeps the pins current.

min_version = "2026.10.0"

[settings]
# Never pick a release younger than 3 days, as with Renovate and Bun (tech spec §16).
minimum_release_age = "3d"

[tools]
# JavaScript runtime, package manager, bundler and test runner for the UI.
bun = "1.4.3"
# Faster Rust test runner with clearer output.
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }
# Supply-chain policy for Rust crates: advisories, licences, bans, sources.
cargo-deny = "0.20.2"
# Finds Rust dependencies that are declared but unused.
"github:Boshen/cargo-shear" = "1.14.0"
# Rust code coverage.
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
# Spell checker for code and docs.
typos = "1.51.1"
# GitHub Actions workflow linters: correctness (actionlint, which uses shellcheck for
# `run:` scripts) and security (zizmor).
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"

# Each top-level task runs all of its per-area tasks (`lint` runs `lint:*`, and so on),
# so a new area plugs in by adding a task with the right prefix. The `ts` tasks run the
# TypeScript toolchain from node_modules, on Bun's runtime (bunfig.toml), never Node.

[tasks."deps:ts"]
description = "Install the TypeScript toolchain's packages, exactly as bun.lock records them"
run = "bun install --frozen-lockfile"

[tasks.fmt]
description = "Format all code"
depends = ["fmt:*"]

[tasks."fmt:rust"]
description = "Format Rust code"
# The fuzz targets are a workspace of their own, which `--all` doesn't reach.
run = ["cargo fmt --all", "cargo fmt --manifest-path fuzz/Cargo.toml"]

[tasks."fmt:ts"]
description = "Format every file that isn't Rust: TypeScript, CSS, JSON, Markdown, YAML and TOML"
depends = ["deps:ts"]
run = "bun run oxfmt"

[tasks.lint]
description = "Run every linter and formatting check"
depends = ["lint:*"]

[tasks."lint:rust"]
description = "Check Rust formatting, run clippy and look for unused dependencies"
run = [
  "cargo fmt --all --check",
  "cargo fmt --manifest-path fuzz/Cargo.toml --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo shear",
]

[tasks."lint:ts"]
description = "Check formatting of non-Rust files, lint and type-check TypeScript, and look for unused code"
depends = ["deps:ts"]
run = [
  "bun run oxfmt --check",
  "bun run oxlint --type-aware --deny-warnings",
  "bun run --filter '*' typecheck",
  "bun run knip",
]

[tasks."lint:workflows"]
description = "Check GitHub Actions workflows for mistakes and security problems"
run = ["actionlint", "zizmor ."]

[tasks."lint:spelling"]
description = "Check spelling in code and docs"
run = "typos"

[tasks."lint:key-tables"]
description = "Check that keywright-core's generated key tables match their generator and sources (needs macOS)"
run = "bun scripts/generate-key-tables.ts --check"

[tasks."lint:contrast"]
description = "Check that the UI's colour tokens meet WCAG AA, in light, dark and Increase Contrast"
run = "bun scripts/check-contrast.ts"

[tasks."lint:css-types"]
description = "Check that the UI's CSS Modules' typings match their stylesheets"
run = "bun scripts/generate-css-types.ts --check"

[tasks."lint:bindings"]
description = "Check that the UI's IPC bindings match the app's commands, events and payloads, and its test keymap the app's"
run = "cargo nextest run --package keywright-app up_to_date"

[tasks.generate]
description = "Regenerate the checked-in generated code"
depends = ["generate:*"]

[tasks."generate:key-tables"]
description = "Regenerate keywright-core's key tables from their pinned upstream sources (needs macOS)"
run = "bun scripts/generate-key-tables.ts"

[tasks."generate:css-types"]
description = "Regenerate the typings of the UI's CSS Modules (*.module.d.css.ts), which name their classes"
run = "bun scripts/generate-css-types.ts"

[tasks."generate:bindings"]
description = "Regenerate the UI's IPC bindings (app/ui/src/ipc/bindings.ts) from the app's commands, events and payloads, and the Sofle keymap and key catalog its tests use (app/ui/src/test/sofle.ts)"
env = { KEYWRIGHT_UPDATE_BINDINGS = "1" }
run = "cargo nextest run --package keywright-app up_to_date"

[tasks.test]
description = "Run all tests"
depends = ["test:*"]

[tasks."test:rust"]
description = "Run the Rust tests, including doc examples"
run = ["cargo nextest run --workspace", "cargo test --workspace --doc"]

[tasks."test:ts"]
description = "Run the TypeScript tests"
depends = ["deps:ts"]
run = "bun run --filter '*' test"

[tasks.hardware]
description = "Run the tests that need a ZMK keyboard on USB: plug its left half in first"
# Ignored by `test`, so CI and machines without a keyboard skip them. One at a time, since
# they share the keyboard. The Bluetooth tests need it unplugged, so they have their own task,
# and the switching test (keywright-device) needs someone to move the cable: it runs on its own.
run = "cargo nextest run --workspace --run-ignored only --test-threads 1 -E 'not binary(bluetooth) and not binary(switching) and not binary(parity)'"

[tasks."hardware:bluetooth"]
description = "Run the tests that need a ZMK keyboard on Bluetooth: connect it to this Mac, and unplug its cable"
# The tests that need someone to switch the keyboard off, or to type until the battery
# level changes, run only on their own (tests/bluetooth.rs).
run = "cargo nextest run --package keywright-transport --test bluetooth --run-ignored only --no-capture -E 'not test(switching_the_keyboard_off) and not test(a_battery_notification)'"

[tasks.audit]
description = "Check dependencies for known vulnerabilities, and Rust crates for licence and source problems"
depends = ["audit:*"]

[tasks."audit:rust"]
description = "Check Rust crates against deny.toml: advisories, licences, banned crates and sources"
run = "cargo deny check"

[tasks."audit:fuzz"]
description = "Check the fuzz targets' crates against deny.toml, as audit:rust does for the main workspace"
run = "cargo deny --manifest-path fuzz/Cargo.toml check"

[tasks."audit:ts"]
description = "Check the packages in bun.lock for known vulnerabilities"
run = "bun audit"

[tasks.check]
description = "Run everything CI requires"
depends = ["lint", "test", "audit"]

[tasks.dev]
description = "Run the app, with the UI from Bun's dev server, which updates it as files change"
depends = ["deps:ts"]
# Tauri's tool starts the UI's dev server first (`beforeDevCommand` in tauri.conf.json).
run = "bun run tauri dev"

[tasks.build]
description = "Build the release binaries: the keywright CLI, and Keywright.app"
depends = ["deps:ts"]
# The app is signed ad hoc (`signingIdentity` in tauri.conf.json); releases are signed
# with Keywright's own certificate instead (tech spec §17).
run = ["cargo build --release --package keywright-cli", "bun run tauri build --bundles app"]

[tasks."build:debug"]
description = "Build the app quickly, unoptimised and without bundling it, as CI does"
depends = ["deps:ts"]
# Unlike `mise run dev`, this embeds the built UI and applies the release CSP, with the
# web inspector on (right-click › Inspect Element): the way to check the CSP.
run = "bun run tauri build --debug --no-bundle"

[tasks.portable]
description = "Build and test the crates that must stay portable (core, studio, sim), as CI does on Linux"
run = [
  "cargo build --package keywright-core --package keywright-studio --package keywright-sim",
  "cargo nextest run --package keywright-core --package keywright-studio --package keywright-sim --no-tests=warn",
]

[tasks.coverage]
description = "Measure Rust test coverage, and fail if keywright-core's drops below 80% of lines"
# One test run, then two reports: the whole workspace, and the core's gate (tech spec §13.2).
run = [
  "rustup component add llvm-tools",
  "cargo llvm-cov nextest --workspace --no-report",
  "cargo llvm-cov report",
  "cargo llvm-cov report --package keywright-core --fail-under-lines 80",
]

[tasks.fuzz]
description = "Fuzz each target in fuzz/ for FUZZ_SECONDS seconds (60 by default)"
# cargo-fuzz isn't in mise's registry, so mise builds it from source the first time this
# task runs, as it does cargo-mutants for `mutants` below.
tools = { "cargo:cargo-fuzz" = "0.13.2" }
# `--sanitizer none`: AddressSanitizer looks for memory errors, which code without `unsafe`
# can't have, and it needs a nightly compiler. Without it, fuzzing runs faster, on the
# pinned toolchain. `--debug-assertions` turns on overflow checks, so an overflow fails too.
# Each target starts from its corpus, which CI caches between runs, and from the inputs
# checked in under fuzz/seeds/, such as a whole backup file, which the fuzzer would take a
# long time to come up with on its own.
run = """
for target in $(cargo fuzz list); do
  mkdir -p "fuzz/corpus/$target" "fuzz/seeds/$target"
  cargo fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" \
    --sanitizer none --debug-assertions -- -max_total_time="${FUZZ_SECONDS:-60}"
done
"""

[tasks.mutants]
description = "Mutation-test keywright-core: change its code in small ways, and report changes no test catches"
# cargo-mutants has no Apple Silicon release binary, so mise builds it from source, the
# first time this task runs. Declaring it here rather than under [tools] keeps
# `mise install` from building it for everyone.
tools = { "cargo:cargo-mutants" = "27.1.0" }
# Code without any tests is reported as missed mutants, rather than failing the run.
env = { NEXTEST_NO_TESTS = "warn" }
run = "cargo mutants --package keywright-core --test-tool nextest"
